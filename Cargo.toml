[package]
name = "termlevel-native"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
alacritty_terminal = "=0.26.0"
libc = "0.2"
nsh-base = { version = "=0.5.0", default-features = false, features = ["term"] }
nsh-core = "=0.5.0"
portable-pty = "=0.9.0"

# AppKit input-contract probe in debug builds; production input uses NSH.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSResponder", "NSView", "NSText", "NSTextView", "NSTextInputClient"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSRange", "NSGeometry"] }
