[package]
name = "termlevel-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]
members = ["crates/ghostty-vt-sys", "crates/ghostty-vt"]
default-members = [".", "crates/ghostty-vt-sys", "crates/ghostty-vt"]
resolver = "3"

[dependencies]
termlevel-ghostty-vt = { path = "crates/ghostty-vt", version = "=0.1.0" }
libc = "0.2"
notify = { version = "=8.2.0", default-features = false, features = ["macos_kqueue"] }
nsh-base = { version = "=0.6.0", default-features = false, features = ["term"] }
nsh-core = "=0.6.0"
portable-pty = "=0.9.0"
url = "2.5"

# Native terminal surface and AppKit input integration.
[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.6.0", default-features = false }
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSWindow", "NSResponder", "NSView", "NSText", "NSTextView", "NSTextInputClient", "NSTextField", "NSControl", "NSEvent", "NSAccessibilityProtocols", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "NSScreen", "NSFont", "NSFontDescriptor", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSRange", "NSGeometry"] }

objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGContext", "CGBitmapContext", "CGImage", "CGColorSpace", "CGDataProvider"] }

objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFDictionary", "CFAttributedString", "CFNumber", "CFData"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor", "CTFontManager", "CTLine", "CTStringAttributes", "objc2-core-graphics"] }
