[package]
name = "termlevel-native"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/ghostty-vt-sys", "crates/ghostty-vt"]
default-members = [".", "crates/ghostty-vt-sys", "crates/ghostty-vt"]
resolver = "3"

[dependencies]
termlevel-ghostty-vt = { path = "crates/ghostty-vt", version = "=0.1.0" }
libc = "0.2"
nsh-base = { version = "=0.5.0", default-features = false, features = ["term"] }
nsh-core = "=0.5.0"
portable-pty = "=0.9.0"

# AppKit input-contract probe in debug builds; production input uses NSH.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSWindow", "NSResponder", "NSView", "NSText", "NSTextView", "NSTextInputClient", "NSTextField", "NSControl", "NSEvent", "NSAccessibilityProtocols", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSRange", "NSGeometry"] }
